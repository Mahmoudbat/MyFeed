name: myfeed
description: "Offline media feed with an encrypted locked gallery."
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Media
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  video_player: ^2.14.1

  # Storage & settings
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0 # biometric unlock key (Android Keystore-backed)

  # Security
  local_auth: ^3.0.2
  cryptography: ^2.9.0          # AES-256-GCM, PBKDF2
  cryptography_flutter: ^2.3.4  # platform (hardware) implementations of the above
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy launchers / full square icon
  image_path: "assets/icon/icon_full.png"
  # Android 8+ adaptive icon (layers are 1024x1024; symbol already inside the safe zone)
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  # Android 13+ themed icon
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 24
